# Project 71 — T config (DPO, helpfulness + safety pairs, LoRA on top of the B1 checkpoint)
#
# Produces: the T row in Table 1 (mean +/- 95% CI over 3 seeds) and Table 2 (ASR per attack
# category, B3 vs T) -- T is the treatment arm; B3 vs T is THE comparison (CLAUDE.md's ONE
# CLAIM).
#
# THIS LORA ADAPTER CONFIG IS THE FIXED TEMPLATE FROM B1 (r=32/alpha=64/dropout=0.05, all
# attention + MLP projections) -- byte-identical to configs/sft_lora.yaml's `lora:` block
# and to configs/dpo_b2.yaml's `lora:` block. scripts/train_dpo.py asserts this equality at
# startup and refuses to run if it drifts. If you ever have a reason to change an adapter
# hyperparameter, it must change for B1, B2 AND T, and the change must be stated explicitly
# in notebook/lab_notebook.md.
#
# MATCHED DATA VOLUME (Methodological Safeguards v2, rule 2): T trains on N helpfulness + M
# safety pairs; B2 trains on N+M helpfulness-only pairs -- same total (19,924), same
# optimiser steps, only composition differs.
#   N (helpfulness pairs, this config)   = 15,000
#   M (safety pairs, this config)        = 4,924  (= ALL of data/processed/pref_safety.jsonl)
#   T total                              = N + M = 19,924
# Both counts (and the actual sampled helpfulness pair ids -- all safety pairs are used, so
# no sampling id list is needed for M) are logged at run time to
# results/T_dpo_seed<seed>/dpo_data_manifest.json.
#
# Hyperparameters CONFIRMED by the coordinator 2026-07-31 (learning_rate, num_train_epochs,
# beta, loss_type, precompute_ref_log_probs), with the binding requirement that they are
# byte-identical across dpo_b2.yaml / dpo_t.yaml / dpo_t_ctrl.yaml -- asserted at startup
# by scripts/train_dpo.py::assert_hyperparams_match_sibling(), not just documented.
# Sequencing (coordinator, 2026-08-01): B2 seed 1 -> T seed 1 -> T_ctrl seed 1 -> remaining
# seeds. Do not launch T until B2 seed 1 has finished AND its degeneracy/over-optimisation
# check has been reported.

model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  cache_dir: D:/hf_cache/hub   # NOTE: cache_dir is the hub-format root, not HF_HOME -- see sft_lora.yaml
  dtype: bfloat16
  attn_implementation: sdpa    # never flash-attn on Blackwell (unsettled per CLAUDE.md)
  trust_remote_code: false

# The B1 checkpoint this arm is built on top of (Gate 1 selection, fixed in advance,
# recorded in notebook/lab_notebook.md and notebook/preregistration.md -- not revisited here).
# UPDATED 2026-08-01: results/B1_sft_seed42 (v1) is VOID -- B1 reproduced a real
# CounselChat therapist's name+credentials verbatim (crisis_adjacent_012), traced to
# non-anonymised signature blocks in the SFT data. Data was scrubbed and B1 retrained into
# results/B1_sft_seed42_v2 (same config, same seed 42, same checkpoint-290 selected by the
# same pre-fixed val-loss criterion). Every B2/T run must point here now; the v1 directory
# is retained only as the void run's provenance record, never built on again.
base_adapter:
  b1_output_dir: results/B1_sft_seed42_v2
  b1_checkpoint: checkpoint-290

data:
  arm: T   # identity label; allowed to differ across configs by design (see
           # assert_hyperparams_match_sibling in scripts/train_dpo.py)
  # Both pools use the TRL 1.9 DPOTrainer conversational schema (see scripts/prepare_pref.py).
  helpful_pool_source: psychocounsel_pref   # scripts/train_dpo.py calls
                                             # prepare_pref.build_helpful_pairs(seed, system_prompt,
                                             # exclude_safety_inversions=True) directly against the raw
                                             # dataset -- in-memory, not reading data/processed/pref_helpful.jsonl
                                             # -- so no shared processed file is regenerated/overwritten.
  # UPDATED 2026-08-01: safety pairs are now built IN-MEMORY by
  # scripts/train_dpo.py calling prepare_pref.build_safety_pairs(seed, system_prompt,
  # direction=safety_direction) directly against the raw PKU-SafeRLHF dataset -- same
  # in-memory pattern as the helpful pool, and a structural (not just conventional)
  # guarantee that T and T_ctrl draw from the SAME 4,924 selected PKU rows (row selection
  # is identical between directions; see prepare_pref.py::_select_safety_contrast_rows).
  # safety_pairs_file is kept only for schema/path parity and is NOT read.
  safety_pairs_file: data/processed/pref_safety.jsonl   # NOT read -- see note above. ALL 4,924
                                                          # rows from build_safety_pairs are used
                                                          # (M = full pool, no sampling).
  safety_direction: safer   # T's treatment: chosen = the response PKU annotators flagged
                             # safe (safer_response_id). T_ctrl (configs/dpo_t_ctrl.yaml)
                             # uses "better" (better_response_id, helpfulness) on the SAME
                             # rows instead -- see Revision 5, notebook/preregistration.md.
  chat_template_path: configs/qwen25_chat_template_generation.jinja
  system_prompt_file: configs/system_prompt.txt

  # Exclusion policy (owner-confirmed, Methodological Safeguards v2 rule 2): identical to
  # dpo_b2.yaml -- drop the 662 inversion rows from the helpfulness pool before sampling.
  # (Safety pairs are a separate, disjoint pool -- PKU-SafeRLHF harmlessness dimension, not
  # psychocounsel_pref -- so this exclusion does not apply to them; the safety pool's own
  # provenance/filtering is documented in scripts/prepare_pref.py's build_safety_pairs().)
  exclude_safety_inversions: true

  # Max-length policy -- identical reasoning and thresholds to dpo_b2.yaml: EXCLUDE (not
  # truncate) any pair where tokenize(prompt+chosen) or tokenize(prompt+rejected) exceeds
  # max_length, so DPO's chosen-vs-rejected comparison is never corrupted by a silently
  # truncated completion. Verified: 0 of 4,924 pref_safety.jsonl rows exceed 2048 tokens in
  # either prompt+chosen or prompt+rejected, so the M=4,924 safety pairs are used in full,
  # unfiltered by this policy in practice.
  max_length_policy: exclude   # exclude | truncate -- do not change without re-stating the
                                # reasoning in lab_notebook.md.
  max_length: 2048

  # MATCHED DATA VOLUME sampling target for this arm (see header comment).
  n_helpful_sample: 15000
  n_safety_sample: 4924   # = all of pref_safety.jsonl (post length-filter, which removes 0 rows)

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  output_dir_template: "results/T_dpo_seed{seed}"
  num_train_epochs: 1        # PROPOSED, not owner-confirmed -- identical to dpo_b2.yaml
  # Same 2x8 + gradient-checkpointing memory profile as B1's post-OOM-fix config
  # (configs/sft_lora.yaml) and dpo_b2.yaml, not the original 4x4.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8   # effective batch = 2 x 8 = 16
  learning_rate: 5.0e-6       # PROPOSED, identical to dpo_b2.yaml -- B2/T must not differ in
                              # any hyperparameter other than data composition.
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_torch          # plain torch AdamW -- no bitsandbytes on native Windows
  weight_decay: 0.0
  max_grad_norm: 1.0
  # BETA IS CLOSED, coordinator decision 2026-08-01 -- see configs/dpo_b2.yaml's comment for
  # the full evidence trail (0.1 -> 0.3 -> matched full-suite check of both -> cap-hit rate
  # statistically indistinguishable between the two betas, both ~4-5x B1 v2's baseline).
  # Reverted to the ORIGINAL 0.1 so the NLL/SFT anchor below is the only change from the
  # starting configuration. Identical across dpo_b2.yaml / dpo_t.yaml / dpo_t_ctrl.yaml,
  # asserted by assert_hyperparams_match_sibling().
  beta: 0.1
  # NLL/SFT ANCHOR, attempt 1 -- identical to dpo_b2.yaml; see its comment for the full
  # reasoning (trl 1.9.0 source verification, weight rationale, mid-run abort rule).
  loss_type: [sigmoid, sft]
  loss_weights: [1.0, 1.0]    # attempt 1; must change in all three configs together if the
                               # mid-run abort rule fires (relaunch at [1.0, 0.2]).
  label_smoothing: 0.0
  disable_dropout: true
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 8
  # NO seed field here, deliberately -- see configs/dpo_b2.yaml's comment for the full
  # reasoning (reproducibility defect found by the eval-harness track 2026-08-01: this
  # field was dead code, never read by scripts/train_dpo.py, and silently misleading).
  # --seed on the command line is the sole source of truth for this 3-seed arm (T seeds
  # 1/2/3); the resolved seed is written into
  # results/T_dpo_seed<seed>/dpo_data_manifest.json.
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 2
  logging_steps: 5
  save_strategy: epoch
  report_to: []
  train_sampling_strategy: random   # explicit, matches TRL's own default
