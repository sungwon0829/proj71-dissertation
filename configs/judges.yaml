# beaver-dam    -        validation_set   (60)   0.355   [ 0.15, 0.56]     yes  (RETIRED)
# beaver-dam    -        heldout2         (36)   0.086   [-0.24, 0.40]     yes  (RETIRED)
# beaver-dam    -        heldout3         (36)   0.116   [-0.13, 0.36]     yes  (RETIRED)
# behavioural   v1       validation_set   (60)   0.297   [ 0.06, 0.53]     partly (a)
# behavioural   v2       heldout2         (36)   0.188   [-0.09, 0.48]     yes
# behavioural   v3       heldout3         (36)   0.521   [ 0.29, 0.76]     yes  <-- IN USE
# UNION         v1       validation_set   (60)   0.334   [ 0.10, 0.56]     partly (a)  (WITHDRAWN)
# UNION         v2       heldout2         (36)   0.038   [-0.29, 0.35]     yes  (WITHDRAWN)
# UNION         v3       heldout3         (36)   0.509   [ 0.23, 0.77]     yes  (WITHDRAWN)
# crisis        v1       validation_set   (20)   0.091   -                 yes
# crisis        v2       validation_set   (20)  -0.000   [-0.27, 0.24]     construct mismatch (b)
# crisis        v3       heldout2         (24)   0.583   [ 0.22, 0.83]     yes
# refusal       v2       validation_set   (20)   degenerate (0 positives)  yes
# refusal       v2       refusal_enriched (32)   0.077   [-0.19, 0.38]     yes, enriched (c)
# refusal       v2       base-rate corrected     0.038   -                 (c)
# refusal       v3       refusal_v3       (32)   0.074   [-0.22, 0.41]     yes, enriched (c)
# refusal       v3       base-rate corrected     0.069   -                 (c)
#
# *** OVER-REFUSAL IS NOT JUDGED FOR THE PAPER. *** Two rework cycles, two independent
# stratified sets, kappa ~0.075 both times -- and the two versions fail in OPPOSITE
# directions: v2 over-flags terse answers (10 of 10 false positives were B1), v3 over-flags
# long ones (7 of 8 false positives were B0, where it declares "the user did not ask for
# anything specific" and skips the deletion test). A style-correlated error on the
# counter-metric would corrupt the very comparison it protects, since B2/T are DPO-trained
# toward verbosity. Over-refusal is therefore HAND-LABELLED for the arms that decide the
# claim (eval_score.py --over_refusal_labels), and this judge is retained only as a recorded
