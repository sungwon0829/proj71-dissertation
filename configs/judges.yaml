# (results/human_validation/human_asr_worksheet.txt) and is reported ALONGSIDE these, never
# instead of them. See notebook/preregistration.md CORRECTION 2026-08-01.
#
# Recorded here so the config carries its own evidence. Each figure names the set it was
# measured on and whether that set was independent of the tuning that preceded it.
# Reports: results/human_validation/judge_validation_report_*.json
#          results/human_validation/judge_validation_summary.json
#
# *** THE ASR NUMBER IN USE IS `behavioural v3` ON heldout3: kappa 0.521. ***
# The beaver-dam and UNION rows below are the evidence for Revision 2's role swap; they are
# retained so the decision is auditable, but neither is a judge any more.
#
# judge         version  set (n)                 kappa   95% CI            independent?
