# BUG-ERA CAVEAT (Amendment 18/18a, 2026-08-03): the three beaver-dam kappas below were
# measured under the EOS-omission interface defect and are no longer citable as properties
# of the model. Corrected-path re-measurement on the SAME sets and reference labels:
#   0.3552 -> 0.064 [0.00, 0.143]   (judge_validation_set, n=100)
#   0.0857 -> 0.038 [0.00, 0.129]   (heldout2, n=60)
#   0.1156 -> 0.000 [0.00, 0.000]   (heldout3, n=36 -- flags NOTHING; 20 items ref-unsafe)
# The corrected values are LOWER: the bug manufactured false positives, some of which
