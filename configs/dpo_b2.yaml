# Project 71 — B2 config (DPO, helpfulness pairs ONLY, LoRA on top of the B1 checkpoint)
#
# Produces: the B2 row in Table 1 (mean +/- 95% CI over 3 seeds), and B3 = B2 + guardrail
# filter at inference (the baseline Table 1/2 compare T against).
#
# THIS LORA ADAPTER CONFIG IS THE FIXED TEMPLATE FROM B1 (r=32/alpha=64/dropout=0.05, all
# attention + MLP projections) -- byte-identical to configs/sft_lora.yaml's `lora:` block.
# scripts/train_dpo.py asserts this equality at startup and refuses to run if it drifts.
# If you ever have a reason to change an adapter hyperparameter, it must change for B1, B2
# AND T, and the change must be stated explicitly in notebook/lab_notebook.md.
#
# MATCHED DATA VOLUME (Methodological Safeguards v2, rule 2): T trains on N helpfulness +
# M safety pairs; B2 must train on N+M helpfulness-only pairs so total volume and optimiser
# steps match and a T effect is not confounded with data volume.
#   N (helpfulness pairs used by T)      = 15,000
#   M (safety pairs used by T)           = 4,924
#   B2 total (this config)               = N + M = 19,924  (helpfulness-only)
# Both counts (and the actual sampled pair ids) are logged at run time to
# results/B2_dpo_seed<seed>/dpo_data_manifest.json -- never hardcoded here beyond N/M below,
# which exist so the two configs are self-documenting and so the training script can assert
# N_b2 == N_t + M_t without needing to read the sibling config file.
#
# DO NOT LAUNCH YET -- draft only, per the coordinator's Task 2 instruction. learning_rate,
# num_train_epochs, beta, loss_type and precompute_ref_log_probs below are proposed defaults
# (literature-standard LoRA-DPO values), not yet owner-confirmed -- flagged in the lab
# notebook / report, not silently assumed final.

model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  cache_dir: D:/hf_cache/hub   # NOTE: cache_dir is the hub-format root, not HF_HOME -- see sft_lora.yaml
  dtype: bfloat16
  attn_implementation: sdpa    # never flash-attn on Blackwell (unsettled per CLAUDE.md)
  trust_remote_code: false

# The B1 checkpoint this arm is built on top of (Gate 1 selection, fixed in advance,
# recorded in notebook/lab_notebook.md and notebook/preregistration.md -- not revisited here).
# UPDATED 2026-08-01: results/B1_sft_seed42 (v1) is VOID -- B1 reproduced a real
# CounselChat therapist's name+credentials verbatim (crisis_adjacent_012), traced to
# non-anonymised signature blocks in the SFT data. Data was scrubbed and B1 retrained into
# results/B1_sft_seed42_v2 (same config, same seed 42, same checkpoint-290 selected by the
# same pre-fixed val-loss criterion). Every B2/T run must point here now; the v1 directory
# is retained only as the void run's provenance record, never built on again.
base_adapter:
  b1_output_dir: results/B1_sft_seed42_v2
  b1_checkpoint: checkpoint-290

data:
  arm: B2   # identity label; allowed to differ across configs by design (see
            # assert_hyperparams_match_sibling in scripts/train_dpo.py)
  # Both pools use the TRL 1.9 DPOTrainer conversational schema (see scripts/prepare_pref.py).
  helpful_pool_source: psychocounsel_pref   # scripts/train_dpo.py calls
                                             # prepare_pref.build_helpful_pairs(seed, system_prompt,
                                             # exclude_safety_inversions=True) directly against the raw
                                             # dataset -- in-memory, not reading data/processed/pref_helpful.jsonl
                                             # -- so no shared processed file is regenerated/overwritten.
  safety_pairs_file: data/processed/pref_safety.jsonl   # not used by B2 (helpfulness-only, n_safety_sample=0);
                                                          # present for schema/path parity with dpo_t*.yaml.
  safety_direction: safer   # not used by B2 (n_safety_sample=0); present for schema parity only.
  chat_template_path: configs/qwen25_chat_template_generation.jinja
  system_prompt_file: configs/system_prompt.txt

  # Exclusion policy (owner-confirmed, Methodological Safeguards v2 rule 2):
  # drop the 662 rows where rejected_safety_rating > chosen_safety_rating from the
  # helpfulness pool BEFORE sampling, so B2 is a clean helpfulness-only arm rather than one
  # nudged toward less-safe outputs. Verified count: 34,329 total -> 662 excluded -> 33,667
  # remain (before the length filter below).
  exclude_safety_inversions: true

  # Max-length policy (owner-requested: decide and document rather than let the trainer
  # silently truncate). DPOConfig in TRL 1.9 has a single `max_length` covering the whole
  # tokenized (prompt+completion) sequence, truncated via `truncation_mode` (default
  # "keep_start" = keeps the prompt, cuts the TAIL of the completion) if left to the trainer.
  # For DPO specifically, silently truncating a completion mid-sentence would corrupt the
  # preference signal being compared (chosen vs rejected), so -- consistent with the
  # project's zero-truncation policy already enforced for SFT (train_sft.py) -- we EXCLUDE
  # rather than truncate: any pair where tokenize(prompt+chosen) or tokenize(prompt+rejected)
  # exceeds max_length is dropped from the pool before sampling, not fed to the trainer to
  # truncate. max_length below is kept as a redundant safety net in DPOConfig (should never
  # actually trigger given the pre-filter) and as the exclusion threshold itself.
  # Verified counts against the psychocounsel_pref pool: 77 of 34,329 rows exceed 2048 tokens
  # (all in prompt+rejected; prompt+chosen never exceeds it; pref_safety.jsonl has 0 rows
  # over 2048 in either). Combined with the 662 inversion-exclusion (6 rows are excluded by
  # both criteria), the final available helpfulness pool is 33,596 rows -- comfortably above
  # the 19,924 this config samples.
  max_length_policy: exclude   # exclude | truncate -- "exclude" chosen; do not change without
                                # re-stating the reasoning above in lab_notebook.md.
  max_length: 2048

  # MATCHED DATA VOLUME sampling target for this arm (see header comment).
  n_helpful_sample: 19924
  n_safety_sample: 0

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  output_dir_template: "results/B2_dpo_seed{seed}"
  num_train_epochs: 1        # PROPOSED, not owner-confirmed -- standard for a ~20k-pair DPO run
  # Same 2x8 + gradient-checkpointing memory profile as B1's post-OOM-fix config
  # (configs/sft_lora.yaml), not the original 4x4 -- required per Task 2 instruction, since
  # DPO forward/backward passes are more memory-hungry per step (chosen + rejected + implicit
  # reference forward, even with the adapter-disable reference-free trick).
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8   # effective batch = 2 x 8 = 16
  learning_rate: 5.0e-6       # PROPOSED, not owner-confirmed -- literature-standard LoRA-DPO LR
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: adamw_torch          # plain torch AdamW -- no bitsandbytes on native Windows
  weight_decay: 0.0
  max_grad_norm: 1.0
  # BETA IS CLOSED, coordinator decision 2026-08-01. Sequence: 0.1 (B2 v2) -> reward-hacking
  # degeneracy (margins ~8.3, accuracy ~1.0; 4/8 sanity prompts) -> raised to 0.3 (B2 v3) ->
  # full-suite quantification showed WORSE strict/loose degeneracy than beta=0.1, not better
  # (14.3%/23.7% vs B1's 3.0%/6.0%) -> pre-committed stopping rule then required a matched
  # full-suite check of beta=0.1 before reverting, which found 0.1 is not clean either
  # (loose=21.3%, 6/300 fabricated turns, against the rule's own bar of <=~8% loose / 0
  # fabricated). CLOSING NUMBER: cap-hit rate (fraction of responses reaching max_new_tokens
  # without ever emitting EOS) is statistically indistinguishable between the two betas --
  # 23.0% (0.1) vs 23.7% (0.3) -- while both sit 4-5x above B1 v2's 5.0% baseline. Beta is
  # therefore not the lever; reverting to the ORIGINAL 0.1 so the NLL/SFT anchor below is the
  # only change from the starting configuration (keeps the diagnosis single-variable). See
  # notebook/pending_dpo_b2.md for the full evidence trail.
  beta: 0.1
  # NLL/SFT ANCHOR, attempt 1 (coordinator decision 2026-08-01): combine the standard sigmoid
  # DPO loss with an SFT (cross-entropy over the CHOSEN completion only) anchor term, to
  # counter the degeneration observed at every beta tried so far. Verified against the
  # installed trl 1.9.0 source (trl/trainer/dpo_trainer.py) before relying on it:
  #   - loss_type accepts a list (`__post_init__` coerces a bare str to a 1-item list);
  #     losses are combined as `loss += per_sequence_loss.mean() * loss_weight` per
  #     zip(loss_types, loss_weights, strict=True) -- so loss_weights MUST be the same length
  #     as loss_type or DPOConfig raises at construction, not silently truncates/broadcasts.
  #   - the "sft" branch (~line 1542) computes token-mean cross-entropy over `shift_logits`/
  #     `shift_labels`/`shift_completion_mask` chunked to the chosen half of the batch; these
  #     come from `outputs` = the POLICY model's own forward pass inside concatenated_forward,
  #     not from `ref_outputs` -- so this term has no interaction with
  #     precompute_ref_log_probs, which only controls how the REFERENCE log-probs are
  #     obtained. completion_mask already implements assistant-only loss (prompt tokens
  #     excluded), consistent with the project's SFT convention.
  # Weight rationale: the sigmoid term converges to ~0.06 nats while the sft term is a
  # token-mean cross-entropy (~1-2 nats), so loss_weights=[1.0, 1.0] makes the anchor
  # dominant by construction, not by accident -- this is the intended "hold the policy near
  # its SFT distribution" effect, not a bug. MID-RUN ABORT RULE: read train.log at ~step 50;
  # if rewards/accuracies stalls below ~0.8, kill and relaunch at loss_weights=[1.0, 0.2].
  loss_type: [sigmoid, sft]
  loss_weights: [1.0, 1.0]    # attempt 1. If the mid-run abort rule fires, relaunch at
                               # [1.0, 0.2] -- must change in dpo_b2.yaml / dpo_t.yaml /
                               # dpo_t_ctrl.yaml together, asserted by
                               # assert_hyperparams_match_sibling().
  label_smoothing: 0.0
  disable_dropout: true       # TRL default; explicit here for auditability
  precompute_ref_log_probs: true   # PROPOSED perf choice: with peft_config set and ref_model=None,
                                    # TRL computes the reference log-probs via an adapter-disabled
                                    # forward pass; precomputing them once up front (rather than every
                                    # step) roughly halves the forward-pass cost per training step.
  precompute_ref_batch_size: 8
  # NO seed field here, deliberately. This config is shared across seeds 1/2/3 (B2 is a
  # 3-seed arm) -- a fixed value here would be dead code at best (it was never actually
  # read: scripts/train_dpo.py always builds DPOConfig(seed=<CLI --seed>, ...), never
  # t_cfg["seed"]) and a silent-reproducibility trap at worst (a peer reproducing from
  # this file alone, by reading YAML rather than the script, would get a DIFFERENT seed
  # than the one actually used -- found by the eval-harness track 2026-08-01 while fixing
  # the seed record; B2 seed 1 was launched with --seed 1 while this field said 42).
  # --seed on the command line is the sole source of truth; scripts/train_dpo.py asserts
  # at startup that this config does NOT declare a "seed" key (fails loudly if one is
  # reintroduced), and writes the resolved seed into
  # results/<arm>_dpo_seed<seed>/dpo_data_manifest.json so every run's artefact records
  # its own actual seed unambiguously.
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 2
  logging_steps: 5
  save_strategy: epoch
  report_to: []
  train_sampling_strategy: random   # explicit, matches TRL's own default (see sft_lora.yaml precedent)
